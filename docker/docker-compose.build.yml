# =============================================================================
# AI IM Connector — 建置 Docker Image（支援 amd64 / arm64 多平台）
# 建置：docker compose -f docker-compose.build.yml build
# 推送至 ACR：./publish.sh
# =============================================================================

services:
  im-connector:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      platforms:
        - linux/amd64
        - linux/arm64
    image: ${ACR_REGISTRY}/ai-connector/im-connector:${IMAGE_VERSION}
