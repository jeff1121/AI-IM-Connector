name: Copilot Code Review

on:
  pull_request:
    branches: ['**']

permissions:
  contents: read
  pull-requests: write

jobs:
  copilot-review:
    name: GitHub Copilot 程式碼審查
    runs-on: ubuntu-latest

    steps:
      - name: 簽出程式碼
        uses: actions/checkout@v4

      - name: GitHub Copilot Code Review
        uses: github/copilot-code-review@v1
