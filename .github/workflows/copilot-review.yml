name: 程式碼審查報告

on:
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  code-review:
    name: 程式碼審查、修復與報告
    runs-on: ubuntu-latest

    steps:
      - name: 簽出程式碼
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0

      - name: 設定 .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 還原相依套件
        run: dotnet restore

      - name: 建置專案
        id: build
        continue-on-error: true
        run: |
          dotnet build --no-restore -c Release 2>&1 | tee build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          WARNINGS=$(grep -c " warning " build.log || true)
          ERRORS=$(grep -c " error " build.log || true)
          echo "warnings=$WARNINGS" >> $GITHUB_OUTPUT
          echo "errors=$ERRORS" >> $GITHUB_OUTPUT
          if [ "$BUILD_EXIT" -eq 0 ]; then
            echo "status=✅ 成功" >> $GITHUB_OUTPUT
          else
            echo "status=❌ 失敗" >> $GITHUB_OUTPUT
          fi

      - name: 執行測試
        id: test
        continue-on-error: true
        run: |
          dotnet test --no-build -c Release --verbosity normal 2>&1 | tee test.log
          PASSED=$(grep -oP 'Passed:\s*\K\d+' test.log | tail -1 || echo "0")
          FAILED=$(grep -oP 'Failed:\s*\K\d+' test.log | tail -1 || echo "0")
          SKIPPED=$(grep -oP 'Skipped:\s*\K\d+' test.log | tail -1 || echo "0")
          TOTAL=$(grep -oP 'Total:\s*\K\d+' test.log | tail -1 || echo "0")
          echo "passed=${PASSED:-0}" >> $GITHUB_OUTPUT
          echo "failed=${FAILED:-0}" >> $GITHUB_OUTPUT
          echo "skipped=${SKIPPED:-0}" >> $GITHUB_OUTPUT
          echo "total=${TOTAL:-0}" >> $GITHUB_OUTPUT
          if [ "${FAILED:-0}" = "0" ]; then
            echo "status=✅ 全部通過" >> $GITHUB_OUTPUT
          else
            echo "status=❌ 有失敗項目" >> $GITHUB_OUTPUT
          fi

      - name: 程式碼格式檢查與自動修復
        id: format
        run: |
          if dotnet format --verify-no-changes 2>/dev/null; then
            echo "status=✅ 格式正確" >> $GITHUB_OUTPUT
          else
            echo "status=⚠️ 已自動修復並提交" >> $GITHUB_OUTPUT
            dotnet format
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "style: 自動修復程式碼格式問題

          Co-authored-by: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
              git push
            fi
          fi

      - name: GitHub Copilot 程式碼審查
        if: github.event_name == 'pull_request'
        uses: github/copilot-code-review@v1

      - name: 產生程式碼審查報告
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const report = [
              '## 🔍 程式碼審查報告',
              '',
              '### 📊 審查摘要',
              '',
              '| 檢查項目 | 結果 | 詳細 |',
              '|----------|------|------|',
              `| **建置** | ${{ steps.build.outputs.status }} | 警告: ${{ steps.build.outputs.warnings || '0' }} 個、錯誤: ${{ steps.build.outputs.errors || '0' }} 個 |`,
              `| **測試** | ${{ steps.test.outputs.status }} | 通過: ${{ steps.test.outputs.passed || '0' }}、失敗: ${{ steps.test.outputs.failed || '0' }}、跳過: ${{ steps.test.outputs.skipped || '0' }}、總計: ${{ steps.test.outputs.total || '0' }} |`,
              `| **程式碼格式** | ${{ steps.format.outputs.status }} |  |`,
              '| **Copilot 審查** | 🤖 已提交審查意見 |  |',
              '',
              '---',
              '> 📋 此報告由 GitHub Actions 自動產生'
            ].join('\n');

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.payload.pull_request.number,
              body: report
            });

      - name: 上傳建置與測試紀錄
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-logs
          path: |
            build.log
            test.log
          retention-days: 30
