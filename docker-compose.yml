version: '3.8'

services:
  # === Caddy 反向代理（自動 HTTPS 憑證管理） ===
  caddy:
    image: caddy:2-alpine
    container_name: ai-im-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # 憑證持久化
      - caddy_config:/config
    depends_on:
      - ai-im-connector
    restart: unless-stopped

  # === API 服務 ===
  ai-im-connector:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-im-connector
    expose:
      - "8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      # LINE 設定
      - Im__Line__ChannelAccessToken=${LINE_CHANNEL_ACCESS_TOKEN}
      - Im__Line__ChannelSecret=${LINE_CHANNEL_SECRET}
      # Telegram 設定
      - Im__Telegram__BotToken=${TELEGRAM_BOT_TOKEN}
      - Im__Telegram__SecretToken=${TELEGRAM_SECRET_TOKEN}
      # ACP Server 連線設定（連線到主機上執行的 copilot --headless --port）
      - Acp__CliUrl=${ACP_CLI_URL}
      - Acp__ResponseTimeoutSeconds=${RESPONSE_TIMEOUT}
      # Agent 綁定
      - AgentBindings__Bindings__Line__AgentName=${LINE_AGENT_NAME}
      - AgentBindings__Bindings__Line__Model=${LINE_MODEL}
      - AgentBindings__Bindings__Telegram__AgentName=${TELEGRAM_AGENT_NAME}
      - AgentBindings__Bindings__Telegram__Model=${TELEGRAM_MODEL}
    extra_hosts:
      # 允許容器連線到主機（macOS/Windows Docker Desktop 預設支援 host.docker.internal）
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
