version: '3.8'

services:
  ai-im-connector:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-im-connector
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # LINE 設定（請替換為實際值）
      - Im__Line__ChannelAccessToken=${LINE_CHANNEL_ACCESS_TOKEN}
      - Im__Line__ChannelSecret=${LINE_CHANNEL_SECRET}
      # Telegram 設定（請替換為實際值）
      - Im__Telegram__BotToken=${TELEGRAM_BOT_TOKEN}
      - Im__Telegram__SecretToken=${TELEGRAM_SECRET_TOKEN}
      # ACP Server 連線設定（連線到主機上執行的 copilot --acp --port 10080）
      - Acp__ServerHost=${ACP_SERVER_HOST:-host.docker.internal}
      - Acp__ServerPort=${ACP_SERVER_PORT:-10080}
      - Acp__ResponseTimeoutSeconds=${RESPONSE_TIMEOUT:-120}
      # Agent 綁定
      - AgentBindings__Bindings__Line__AgentName=${LINE_AGENT_NAME:-copilot-cli}
      - AgentBindings__Bindings__Line__Model=${LINE_MODEL:-gpt-5}
      - AgentBindings__Bindings__Telegram__AgentName=${TELEGRAM_AGENT_NAME:-gemini-cli}
      - AgentBindings__Bindings__Telegram__Model=${TELEGRAM_MODEL:-claude-sonnet-4.5}
    extra_hosts:
      # 允許容器連線到主機（macOS/Windows Docker Desktop 預設支援 host.docker.internal）
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
